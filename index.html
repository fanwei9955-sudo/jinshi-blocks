<body>

<style>
/* Layout: lacquer stage. Portrait = stats | metal well | queue, thumb pads below. Landscape = pads flank the well. */
:root {
  --lacquer: #1a1926;
  --lacquer-hi: #29283d;
  --panel-line: rgba(255,255,255,.07);
  --text: #ece6da;
  --muted: #9b96aa;
  --seal: #c4553f;
  --seal-deep: #6e2a1c;
  --champagne: #cfb682;
  --champagne-deep: #6b5530;
  --key-top: #3d3c57;
  --key-bot: #2c2b42;
  --key-edge: #121119;
  --f-display: "ZCOOL QingKe HuangYou", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  --f-num: "Unbounded", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --f-body: -apple-system, system-ui, "PingFang SC", "Hiragino Sans GB", sans-serif;
  --k: clamp(56px, 9.5vmin, 84px);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; }
html, body { overflow: hidden; overscroll-behavior: none; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--lacquer-hi), var(--lacquer) 65%);
  background-color: var(--lacquer);
  color: var(--text);
  font-family: var(--f-body);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
}
.app {
  height: 100%; box-sizing: border-box;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(10px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
  display: grid; gap: 12px;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top" "stage" "pad";
  max-width: 900px; margin: 0 auto;
}

/* top bar */
.top { grid-area: top; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.seal {
  width: 38px; height: 38px; border-radius: 9px; flex: none;
  background: linear-gradient(160deg, #d46a52, var(--seal) 55%, #9c3a27);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 3px 0 var(--seal-deep), 0 6px 12px rgba(0,0,0,.35);
  display: grid; grid-template-columns: 1fr 1fr; place-items: center;
  font-family: var(--f-display); color: #fbe9dc; font-size: 15px; line-height: 1; padding: 4px; box-sizing: border-box;
}
.wordmark { font-family: var(--f-display); font-size: 26px; letter-spacing: .06em; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.wordmark small { display: block; font-family: var(--f-body); font-size: 10px; letter-spacing: .22em; color: var(--muted); margin-top: -2px; }
.tools { display: flex; gap: 10px; }

/* chunky keys */
.key {
  appearance: none; border: 0; cursor: pointer; color: var(--text);
  font: 600 13px var(--f-body); letter-spacing: .06em;
  border-radius: 20px;
  background: linear-gradient(180deg, var(--key-top), var(--key-bot));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 -2px 0 rgba(0,0,0,.25), 0 5px 0 var(--key-edge), 0 10px 18px rgba(0,0,0,.4);
  display: grid; place-items: center; gap: 2px;
  transition: transform 70ms ease, box-shadow 70ms ease;
  touch-action: none; -webkit-tap-highlight-color: transparent;
  position: relative;
}
.key svg { width: 44%; height: 44%; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.key:active, .key.down {
  transform: translateY(4px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1), inset 0 -1px 0 rgba(0,0,0,.25), 0 1px 0 var(--key-edge), 0 3px 8px rgba(0,0,0,.4);
}
.key:focus-visible { outline: 2px solid var(--champagne); outline-offset: 3px; }
.key.metal { color: #2b2216; background: linear-gradient(180deg, #dcc797, var(--champagne) 45%, #a98c58);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 0 rgba(0,0,0,.18), 0 5px 0 var(--champagne-deep), 0 10px 18px rgba(0,0,0,.4); }
.key.metal:active, .key.metal.down { box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 1px 0 var(--champagne-deep), 0 3px 8px rgba(0,0,0,.4); }
.key.seal-key { color: #fdeee4; background: linear-gradient(180deg, #d77259, var(--seal) 50%, #a3412d);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 -2px 0 rgba(0,0,0,.2), 0 5px 0 var(--seal-deep), 0 10px 18px rgba(0,0,0,.4); }
.key.seal-key:active, .key.seal-key.down { box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 1px 0 var(--seal-deep), 0 3px 8px rgba(0,0,0,.4); }
.key.round { width: 44px; height: 44px; border-radius: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 4px 0 var(--key-edge), 0 8px 14px rgba(0,0,0,.35); }
.key.round svg { width: 52%; height: 52%; stroke-width: 2.2; }
.key.round.off { color: var(--muted); }
.key.round.off::after { content: ""; position: absolute; width: 60%; height: 2.5px; border-radius: 2px; background: var(--seal); transform: rotate(-40deg); }
.key .cap { font-size: 11px; letter-spacing: .14em; }

/* stage */
.stage { grid-area: stage; display: grid; gap: 12px; min-height: 0;
  grid-template-columns: minmax(68px, 128px) minmax(0, 1fr) minmax(68px, 128px); }
.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card {
  border-radius: 18px; padding: 10px; box-sizing: border-box;
  background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.02));
  border: 1px solid var(--panel-line);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
}
.lbl { font-size: 10px; letter-spacing: .16em; color: var(--muted); display: flex; justify-content: space-between; gap: 4px; }
.lbl b { font-weight: 600; color: var(--text); opacity: .75; letter-spacing: .1em; }
.num { font-family: var(--f-num); font-weight: 700; font-size: clamp(15px, 2.6vmin, 24px); font-variant-numeric: tabular-nums; margin-top: 4px; overflow-wrap: anywhere; }
.num.small { font-size: clamp(13px, 2vmin, 18px); font-weight: 500; }
.mini { display: block; width: 100%; margin-top: 6px; }
.mini.dim { opacity: .35; }

.slot { min-width: 0; min-height: 0; display: grid; place-items: center; }
.well {
  position: relative; padding: 6px; border-radius: 20px;
  background: linear-gradient(150deg, #57566e, #2f2e3e 40%, #22212d);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 -1px 0 rgba(0,0,0,.4), 0 22px 44px rgba(0,0,0,.5);
  touch-action: none;
}
#board { display: block; border-radius: 14px; }
.overlay {
  position: absolute; inset: 6px; border-radius: 14px;
  background: rgba(18,17,27,.74); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  display: grid; place-items: center; text-align: center; padding: 18px; box-sizing: border-box;
}
.ov-inner { display: grid; gap: 14px; justify-items: center; max-width: 30ch; }
.ov-title { font-family: var(--f-display); font-size: clamp(28px, 6vmin, 46px); letter-spacing: .08em; margin: 0; text-wrap: balance; }
.ov-text { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0; text-wrap: balance; }
.ov-text strong { color: var(--text); font-family: var(--f-num); font-weight: 500; }
.ov-btn { width: auto; min-width: 150px; height: 56px; padding-inline: 24px; font-size: 16px; letter-spacing: .2em; }
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 16px;
  background: rgba(0,0,0,.28); box-shadow: inset 0 1px 3px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.06); }
.seg-btn { appearance: none; border: 0; cursor: pointer; min-width: 84px; height: 38px; border-radius: 12px;
  font: 600 14px var(--f-body); letter-spacing: .18em; color: var(--muted); background: transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; -webkit-tap-highlight-color: transparent; }
.seg-btn .sw { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.seg-btn[data-theme="metal"] .sw { background: linear-gradient(160deg, #e2cb98, #a98c58); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
.seg-btn[data-theme="glass"] .sw { background: linear-gradient(160deg, rgba(220,240,255,.85), rgba(169,191,240,.35)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); }
.seg-btn[aria-pressed="true"] { color: var(--text); background: linear-gradient(180deg, var(--key-top), var(--key-bot));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 2px 0 var(--key-edge), 0 4px 8px rgba(0,0,0,.35); }
.seg-btn:focus-visible { outline: 2px solid var(--champagne); outline-offset: 2px; }
.hints { font-size: 11.5px; color: var(--muted); line-height: 1.7; margin: 0; }
.toast {
  position: absolute; left: 0; right: 0; top: 28%; text-align: center; pointer-events: none;
  font-family: var(--f-display); font-size: clamp(26px, 6vmin, 44px); color: var(--champagne);
  text-shadow: 0 2px 0 rgba(0,0,0,.4), 0 0 18px rgba(207,182,130,.25);
  opacity: 0; transform: scale(.8);
}
.toast.show { animation: pop 900ms cubic-bezier(.2,1.4,.4,1) forwards; }
.gain {
  position: absolute; left: 0; right: 0; text-align: center; pointer-events: none;
  font-family: var(--f-num); font-weight: 700; font-size: clamp(22px, 5.5vmin, 36px); font-variant-numeric: tabular-nums;
  color: var(--text); text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 0 14px rgba(236,230,218,.25);
  opacity: 0;
}
.gain.big { color: var(--champagne); font-size: clamp(28px, 7vmin, 46px); text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 0 22px rgba(207,182,130,.45); }
.gain.show { animation: rise 1000ms cubic-bezier(.2,.9,.3,1) forwards; }
@keyframes rise { 0% { opacity: 0; transform: translateY(6px) scale(.8) } 15% { opacity: 1; transform: translateY(0) scale(1.08) } 60% { opacity: 1; transform: translateY(-18px) scale(1) } 100% { opacity: 0; transform: translateY(-40px) scale(1) } }
@keyframes pop { 0% { opacity: 0; transform: scale(.7) } 18% { opacity: 1; transform: scale(1.06) } 70% { opacity: 1; transform: scale(1) } 100% { opacity: 0; transform: translateY(-14px) scale(1) } }

/* pads */
.pad { grid-area: pad; display: flex; justify-content: space-between; align-items: end; gap: 16px; }
.cluster { display: grid; grid-template-columns: repeat(2, var(--k)); grid-auto-rows: var(--k); gap: 14px; }
.cluster .wide { grid-column: span 2; }

@media (orientation: landscape) and (min-width: 820px) {
  .app { max-width: none; grid-template-columns: minmax(170px, 1fr) minmax(0, 640px) minmax(170px, 1fr);
    grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "top top top" "move stage act"; }
  .pad { display: contents; }
  .cluster.move { grid-area: move; }
  .cluster.act { grid-area: act; }
  .cluster { align-self: end; justify-self: center; margin-bottom: 8px; }
}
/* focus mode: no on-screen pads, the well takes the room */
.focus .pad, .focus .cluster { display: none; }
.focus .app { grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "top" "stage"; }
@media (orientation: landscape) and (min-width: 820px) {
  .focus .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "stage"; }
  .focus .stage { max-width: 760px; width: 100%; justify-self: center; }
}
/* focus mode on phones: stats become a strip above a full-width well */
@media (max-width: 600px) {
  .focus .stage { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "l r" "slot slot"; gap: 8px; }
  .focus .side.left { grid-area: l; }
  .focus .side.right { grid-area: r; }
  .focus .slot { grid-area: slot; }
  .focus .side { flex-direction: row; gap: 6px; }
  .focus .side .card { flex: 1 1 0; min-width: 0; padding: 6px 8px; border-radius: 12px; }
  .focus .side .c-score { flex-grow: 1.7; }
  .focus .side .c-best { display: none; }
  .focus .side .lbl b { display: none; }
  .focus .side .num { font-size: 15px; margin-top: 2px; overflow-wrap: normal; white-space: nowrap; }
  .focus .mini { margin-top: 2px; }
}
@media (max-width: 460px) {
  .tools { gap: 8px; }
  .key.round { width: 40px; height: 40px; border-radius: 12px; }
  .wordmark { display: none; }
  .stage { grid-template-columns: 66px minmax(0, 1fr) 66px; gap: 8px; }
  .card { padding: 8px; border-radius: 14px; }
  .wordmark { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .toast.show { animation-duration: 1ms; opacity: 1; }
  .key { transition: none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="seal" aria-hidden="true"><span>金</span><span>石</span><span>方</span><span>块</span></div>
      <div class="wordmark">金石方块<small>TETRA · METAL &amp; STONE</small></div>
    </div>
    <div class="tools">
      <button class="key round" id="btnMusic" aria-label="背景音乐"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></button>
      <button class="key round" id="btnSfx" aria-label="音效"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>
      <button class="key round" id="btnHaptic" aria-label="震动"><svg viewBox="0 0 24 24"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4.5 9v6M19.5 9v6"/></svg></button>

  <main class="stage">

    <aside class="side right">

  </main>

  <div class="pad">
    <div class="cluster move">
      <button class="key" data-act="left" aria-label="左移"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="key" data-act="right" aria-label="右移"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="key wide" data-act="down" aria-label="软降"><svg viewBox="0 0 24 24" style="width:22%;height:44%"><path d="M5 9l7 7 7-7"/></svg></button>
    </div>
    <div class="cluster act">
      <button class="key metal" data-act="ccw" aria-label="逆时针旋转"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.34-5.66"/><path d="M4 4v5h5"/></svg></button>
      <button class="key metal" data-act="cw" aria-label="顺时针旋转"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>

      <button class="key seal-key" data-act="drop" aria-label="直落"><svg viewBox="0 0 24 24"><path d="M6 4l6 6 6-6M6 11l6 6 6-6M5 21h14"/></svg></button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= Audio ================= */
const Sound = (() => {
  let ac, master, sfxBus, musBus, delayIn, noiseBuf, timer = null, nextTime = 0, step = 0, bpm = 122;
  const prefs = store.get("jinshi:prefs", { music: true, sfx: true });
  const plucks = new Map();
  const N = f => f; // readability
  const E2 = 82.41, G2 = 98.0, D2 = 73.42, B1 = 61.74;
  // E minor pentatonic (羽调): E G A B D
  const S = [329.63, 392.0, 440.0, 493.88, 587.33, 659.25, 783.99, 880.0, 987.77, 1174.66, 1318.51];
  const mel = (list) => { const m = {}; list.forEach(([s, i]) => m[s] = i); return m; };
  const PHRASE = [
    mel([[0,5],[3,4],[6,5],[8,7],[10,6],[12,5],[14,4],[16,3],[19,4],[22,5],[24,6],[26,5],[28,4],[30,3],
         [32,2],[35,3],[38,4],[40,5],[42,7],[44,8],[46,7],[48,6],[50,5],[52,4],[54,5],[56,3],[60,0],[61,1],[62,2],[63,3]]),
    mel([[0,8],[2,7],[4,8],[6,9],[8,8],[10,7],[12,6],[14,7],[16,5],[18,6],[20,7],[22,6],[24,5],[26,4],[28,5],[30,6],
         [32,4],[34,5],[36,6],[38,7],[40,8],[42,9],[44,10],[46,9],[48,8],[50,7],[52,6],[54,5],[56,7],[60,5],[61,6],[62,7],[63,8]])
  ];
  const ROOTS = [E2, G2, D2, B1];
  const BASS = { 0: 1, 3: 1, 6: 2, 8: 1, 10: 1, 11: 2, 14: 1 };
  const DIZI = [987.77, 783.99, 880.0, 659.25];

  function init() {
    if (ac) { if (ac.state !== "running") ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3;
    master.connect(comp); comp.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.gain.value = prefs.sfx ? 1 : 0; sfxBus.connect(master);
    musBus = ac.createGain(); musBus.gain.value = prefs.music ? 0.5 : 0; musBus.connect(master);
    // dotted-eighth echo for the plucks
    delayIn = ac.createGain(); delayIn.gain.value = 0.28;
    const dl = ac.createDelay(1.5), fb = ac.createGain(), lp = ac.createBiquadFilter();
    dl.delayTime.value = (60 / bpm) * 0.75; fb.gain.value = 0.3; lp.type = "lowpass"; lp.frequency.value = 2600;

const G = { state: "ready", board: [], cur: null, hold: null, canHold: true, queue: [], bag: [],

  grav: 0, lockT: 0, resets: 0, lowest: 0, soft: false, clearing: null, shake: 0 };

}
